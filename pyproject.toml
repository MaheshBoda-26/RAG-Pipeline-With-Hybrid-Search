[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "RAG Pipeline with Hybrid Search"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "openai==1.35.0",
    "qdrant-client==1.10.0",
    "rank-bm25==0.2.2",
    "python-dotenv==1.0.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "numpy==1.26.4",
    "beautifulsoup4==4.12.0",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "pypdf==4.2.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "retrieval*", "generation*", "dashboard*"]
exclude = ["website*", "sample_docs*", "qdrant_data*", "tests*", "tasks*"]

[tool.setuptools]
py-modules = ["api", "config", "pipeline", "cli"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api:app"
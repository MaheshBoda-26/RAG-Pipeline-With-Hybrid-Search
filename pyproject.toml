[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Retrieval-augmented generation over internal docs: hybrid search, reranking, verified citations, and confidence gating."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mahesh Boda" }]
keywords = ["rag", "retrieval-augmented-generation", "hybrid-search", "qdrant", "bm25", "reranking"]
dependencies = [
    "bcrypt==5.0.0",
    "beautifulsoup4==4.12.0",
    "fastapi==0.111.0",
    "fastembed==0.8.0",
    "httpx<0.28.0",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "numpy==1.26.4",
    "openai==1.35.0",
    "pandas==3.0.5",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "pypdf==4.2.0",
    "python-docx==1.2.0",
    "python-dotenv==1.0.1",
    "python-jose==3.5.0",
    "python-magic==0.4.27",
    "python-multipart==0.0.32",
    "qdrant-client==1.10.0",
    "rank-bm25==0.2.2",
    "redis==8.1.0",
    "redisvl==0.27.2",
    "requests==2.34.2",
    "sentence-transformers==6.0.1",
    "slowapi==0.1.10",
    "supabase==2.31.0",
    "uvicorn==0.30.1",
]

[project.urls]
Homepage = "https://github.com/MaheshBoda-26/RAG-Pipeline-With-Hybrid-Search"
Repository = "https://github.com/MaheshBoda-26/RAG-Pipeline-With-Hybrid-Search"
Issues = "https://github.com/MaheshBoda-26/RAG-Pipeline-With-Hybrid-Search/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "retrieval*", "generation*", "dashboard*"]
exclude = ["website*", "sample_docs*", "qdrant_data*", "tests*", "tasks*"]

[tool.setuptools]
py-modules = ["api", "config", "pipeline", "cli"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live API server on localhost:8000 (set RUN_INTEGRATION_TESTS=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "venv", "node_modules", "website", "brag-output", "sample_docs"]

[tool.ruff.lint]
# Bug-level rules only: these must never fail. Broader style rules are a
# follow-up once the codebase is reformatted.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection requires call expressions in argument defaults.
"api.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["config.py", "retrieval/fusion.py", "ingestion/dedup.py"]
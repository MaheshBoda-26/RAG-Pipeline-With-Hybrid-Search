name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # python-magic needs the system libmagic library.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy

      # Unit tests are self-contained: tests marked `integration` (which need a
      # live API on localhost:8000) are skipped by tests/conftest.py.
      - name: Tests (pytest)
        run: pytest -q

  website:
    name: website build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run build
